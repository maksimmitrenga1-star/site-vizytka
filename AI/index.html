<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Генератор карт</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        header {
            text-align: center;
            padding: 30px 15px 15px;
        }

        h1 {
            font-size: 38px;
            margin: 0 0 10px;
        }

        header p {
            color: #aeb8c8;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: auto;
        }

        .controls {
            background: #1f2937;
            padding: 20px;
            border-radius: 18px;
            margin: 20px 0;
        }

        textarea {
            width: 100%;
            min-height: 90px;
            resize: vertical;
            border: 2px solid #374151;
            border-radius: 12px;
            background: #111827;
            color: white;
            padding: 15px;
            font-size: 17px;
            outline: none;
        }

        textarea:focus {
            border-color: #60a5fa;
        }

        button {
            margin-top: 12px;
            padding: 13px 22px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #download {
            background: #16a34a;
            margin-left: 8px;
        }

        #download:hover {
            background: #15803d;
        }

        .examples {
            margin-top: 12px;
            color: #9ca3af;
        }

        .map-box {
            background: #1f2937;
            padding: 15px;
            border-radius: 18px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
            background: #dbeafe;
        }

        .status {
            margin-top: 10px;
            color: #93c5fd;
        }
    </style>
</head>

<body>

<header>
    <h1>🤖 AI Генератор карт</h1>
    <p>Опиши карту, яку хочеш створити</p>
</header>

<div class="container">

    <div class="controls">

        <textarea id="prompt"
            placeholder="Наприклад: велика карта острова з містом, лісом, річкою та дорогами"></textarea>

        <button id="generate">✨ Створити карту</button>
        <button id="download">⬇️ Завантажити</button>

        <div class="examples">
            Приклади:
            <br>
            🏝️ острів з містом і річкою
            <br>
            🌲 великий ліс з дорогами
            <br>
            🏜️ пустеля з містом
            <br>
            ❄️ снігова карта з горами
            <br>
            🏰 середньовічне королівство
        </div>

        <div class="status" id="status"></div>
    </div>

    <div class="map-box">
        <svg id="map" viewBox="0 0 1000 650"></svg>
    </div>

</div>


<script>

const map = document.getElementById("map");
const promptInput = document.getElementById("prompt");
const status = document.getElementById("status");

let seed = 1;


// Псевдовипадкове число
function random() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
}


// Створення SVG елемента
function createElement(name, attributes = {}) {

    const element = document.createElementNS(
        "http://www.w3.org/2000/svg",
        name
    );

    for (const key in attributes) {
        element.setAttribute(key, attributes[key]);
    }

    return element;
}


// Додати текст
function addText(text, x, y, size = 18) {

    const t = createElement("text", {
        x: x,
        y: y,
        "font-size": size,
        fill: "#172033",
        "font-weight": "bold"
    });

    t.textContent = text;

    map.appendChild(t);
}


// Створення карти
function generateMap() {

    const prompt = promptInput.value.toLowerCase();

    if (!prompt.trim()) {
        status.textContent = "⚠️ Спочатку опиши свою карту.";
        return;
    }

    seed = Math.floor(Math.random() * 100000);

    map.innerHTML = "";

    status.textContent = "🤖 Створюю карту...";

    // Фон
    let background = "#9bd3e5";

    if (prompt.includes("пустел")) {
        background = "#e7c878";
    }

    if (
        prompt.includes("сніг") ||
        prompt.includes("зим") ||
        prompt.includes("льод")
    ) {
        background = "#dcebf7";
    }

    if (prompt.includes("ліс")) {
        background = "#9bc58a";
    }

    const backgroundRect = createElement("rect", {
        x: 0,
        y: 0,
        width: 1000,
        height: 650,
        fill: background
    });

    map.appendChild(backgroundRect);


    // Острів
    if (
        prompt.includes("острів") ||
        prompt.includes("остров")
    ) {

        const points = [];

        for (let i = 0; i < 28; i++) {

            const angle = (Math.PI * 2 / 28) * i;

            const radiusX = 370 + random() * 90;
            const radiusY = 220 + random() * 70;

            const x = 500 + Math.cos(angle) * radiusX;
            const y = 325 + Math.sin(angle) * radiusY;

            points.push(`${x},${y}`);
        }

        const island = createElement("polygon", {
            points: points.join(" "),
            fill: "#82b86a",
            stroke: "#486b3e",
            "stroke-width": 5
        });

        map.appendChild(island);
    }


    // Якщо не острів — просто земля
    else {

        const land = createElement("rect", {
            x: 30,
            y: 30,
            width: 940,
            height: 590,
            rx: 30,
            fill:
                prompt.includes("пустел")
                    ? "#d8b968"
                    : prompt.includes("сніг")
                        ? "#dbe7ed"
                        : "#92b86e"
        });

        map.appendChild(land);
    }


    // Гори
    if (
        prompt.includes("гор") ||
        prompt.includes("гір")
    ) {

        for (let i = 0; i < 10; i++) {

            const x = 100 + random() * 800;
            const y = 80 + random() * 250;

            const mountain = createElement("polygon", {
                points:
                    `${x},${y + 80}
                     ${x + 45},${y}
                     ${x + 90},${y + 80}`,
                fill: "#70757a",
                stroke: "#555"
            });

            map.appendChild(mountain);

            const snow = createElement("polygon", {
                points:
                    `${x + 30},${y + 25}
                     ${x + 45},${y}
                     ${x + 60},${y + 25}`,
                fill: "white"
            });

            map.appendChild(snow);
        }
    }


    // Річка
    if (
        prompt.includes("річк") ||
        prompt.includes("ріка")
    ) {

        let points = "";

        for (let y = 0; y <= 650; y += 30) {

            const x =
                450 +
                Math.sin(y / 70) * 100 +
                (random() - 0.5) * 40;

            points += `${x},${y} `;
        }

        const river = createElement("polyline", {
            points: points,
            fill: "none",
            stroke: "#3182ce",
            "stroke-width": 25,
            "stroke-linecap": "round"
        });

        map.appendChild(river);
    }


    // Ліс
    if (
        prompt.includes("ліс") ||
        prompt.includes("дерев")
    ) {

        for (let i = 0; i < 80; i++) {

            const x = 60 + random() * 880;
            const y = 70 + random() * 510;

            const tree = createElement("polygon", {
                points:
                    `${x},${y}
                     ${x - 13},${y + 30}
                     ${x + 13},${y + 30}`,
                fill: "#245c35"
            });

            map.appendChild(tree);

            const trunk = createElement("rect", {
                x: x - 3,
                y: y + 28,
                width: 6,
                height: 10,
                fill: "#704214"
            });

            map.appendChild(trunk);
        }
    }


    // Дороги
    if (
        prompt.includes("дорог") ||
        prompt.includes("шлях")
    ) {

        for (let i = 0; i < 4; i++) {

            const y = 150 + i * 110;

            const road = createElement("path", {
                d:
                    `M 70 ${y}
                     Q 300 ${y - 80}
                     500 ${y}
                     T 930 ${y + 40}`,

                fill: "none",
                stroke: "#c29b62",
                "stroke-width": 14,
                "stroke-linecap": "round"
            });

            map.appendChild(road);
        }
    }


    // Міста
    if (
        prompt.includes("міст") ||
        prompt.includes("місто") ||
        prompt.includes("село") ||
        prompt.includes("замок")
    ) {

        for (let i = 0; i < 5; i++) {

            const x = 150 + random() * 700;
            const y = 130 + random() * 400;

            const house = createElement("rect", {
                x: x,
                y: y,
                width: 45,
                height: 35,
                fill: "#b45309",
                stroke: "#4b2e15",
                "stroke-width": 2
            });

            map.appendChild(house);


            const roof = createElement("polygon", {
                points:
                    `${x - 5},${y}
                     ${x + 22},${y - 25}
                     ${x + 50},${y}`,
                fill: "#7f1d1d"
            });

            map.appendChild(roof);
        }

        addText("🏙 МІСТО", 430, 610, 24);
    }


    // Пустеля
    if (prompt.includes("пустел")) {

        for (let i = 0; i < 30; i++) {

            const x = random() * 950;
            const y = random() * 600;

            const dune = createElement("ellipse", {
                cx: x,
                cy: y,
                rx: 50 + random() * 50,
                ry: 15 + random() * 20,
                fill: "#c79f4e",
                opacity: 0.5
            });

            map.appendChild(dune);
        }
    }


    // Сніг
    if (
        prompt.includes("сніг") ||
        prompt.includes("зим")
    ) {

        for (let i = 0; i < 120; i++) {

            const circle = createElement("circle", {
                cx: random() * 1000,
                cy: random() * 650,
                r: 2 + random() * 3,
                fill: "white"
            });

            map.appendChild(circle);
        }
    }


    // Назва карти
    const title = createElement("text", {
        x: 500,
        y: 45,
        "text-anchor": "middle",
        "font-size": 28,
        "font-weight": "bold",
        fill: "#172033"
    });

    title.textContent = "МОЯ AI-КАРТА";

    map.appendChild(title);

    status.textContent =
        "✅ Готово! Карта створена за твоїм описом.";
}


// Завантаження SVG
document.getElementById("download").addEventListener("click", function () {

    const data =
        new XMLSerializer().serializeToString(map);

    const blob = new Blob(
        [data],
        { type: "image/svg+xml" }
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = "my-ai-map.svg";

    a.click();

    URL.revokeObjectURL(url);
});


document.getElementById("generate")
    .addEventListener("click", generateMap);


// Карта за замовчуванням
promptInput.value =
    "великий острів з містом, лісом, річкою, горами та дорогами";

generateMap();

</script>

</body>
</html>
